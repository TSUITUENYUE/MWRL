[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Workspace root. The importable code lives in packages/: the benchmark-agnostic
# framework (mwrl), three benchmark packages (mwrl-maxsat, mwrl-circuits, mwrl-suzuki) and
# the RLVR post-training package (mwrl-rlvr), each independently installable.
[project]
name = "mwrl-workspace"
version = "0.1.0"
description = "Minimal-Witness RL: core framework plus MaxSAT, LLM-circuit, Suzuki, and RLVR benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = []  # no importable code at the root; install packages/* instead

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mwrl = { workspace = true }
mwrl-maxsat = { workspace = true }
mwrl-circuits = { workspace = true }
mwrl-suzuki = { workspace = true }
mwrl-rlvr = { workspace = true }
