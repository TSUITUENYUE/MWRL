[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Workspace root. The importable code lives in packages/: the benchmark-agnostic
# framework (mwrl) and three benchmark packages (mwrl-maxsat, mwrl-circuits, mwrl-suzuki),
# each independently installable. This root carries only shared dev tooling.
[project]
name = "mwrl-workspace"
version = "0.1.0"
description = "Minimal-Witness RL: core framework plus MaxSAT, LLM-circuit, and Suzuki benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["mypy>=1.8", "pre-commit>=3.6", "pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
packages = []  # no importable code at the root; install packages/* instead

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mwrl = { workspace = true }
mwrl-maxsat = { workspace = true }
mwrl-circuits = { workspace = true }
mwrl-suzuki = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
